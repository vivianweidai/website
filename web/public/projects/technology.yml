          description: Distance, velocity and acceleration
          short: Motion
        - name: Vernier Go Direct Photogate
          description: Light beam timer
          short: Time
    - tech: Thermodynamics
      specs: Pressure and turbidity
      toys:
        - name: Vernier Go Direct Gas Pressure Sensor
          description: Sealed syringe gas pressure
