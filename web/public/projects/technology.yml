# Tech & Toys catalog — the single source of truth for what we own.
#
# This file is a CATALOG, not a set of pages. There are no tech pages on the
# site any more (the web/public/projects/technology/ folder was deleted
# 2026-07-30 — it was a documentation layer nobody read, and its hero photos
# were better off as gallery tiles). What survives is the vocabulary:
#
#   science  →  category (tech)  →  toys
#
# and that vocabulary does real work in three places:
#   · the home page's Projects tab lists each science's categories
#   · the /projects/ wall filters on them
#   · gallery.yml tags a photo with a `toy:`, which rolls up to its category
#
# Toys used to live in each tech page's frontmatter and were merged in at
# build time. With the pages gone they live here, inline, which is where a
# reader would have looked for them anyway.
#
# Run `python3 pipeline/scripts/build_technology.py` after edits.
#
#   science:  Biology | Chemistry | Physics | Computing | Mathematics | Astronomy
#   techs:    the categories, in display order
#     - tech:   category name
#       specs:  one line on what the category is for
#       toys:   instruments/libraries under it
#         - name:         exact product name — never abbreviate or rearrange
#           description:  one or two words on what it is for
#           short:        the label shown in the UI (defaults to `name`)


# ══════════════════════════════════════════════════════════════
# MATHEMATICS
# ══════════════════════════════════════════════════════════════

- science: Mathematics
  techs:
    - tech: Numeric
      specs: Approximate
      toys:
        - name: NumPy
          description: Linear algebra and vector math
        - name: SciPy
          description: Scientific computing
    - tech: Symbolic
      specs: Exact
      toys:
        - name: Wolfram
          description: Symbolic computation engine
    - tech: Graphic
      specs: 2D and 3D
      toys:
        - name: Matplotlib
          description: 2D and 3D
        - name: LaTeX
          description: Document typesetting


# ══════════════════════════════════════════════════════════════
# COMPUTING
# ══════════════════════════════════════════════════════════════

- science: Computing
  techs:
    - tech: Statistics
      specs: Inference
      toys:
        - name: SciPy
          description: Statistical inference
    - tech: Machine Learning
      specs: Classic models
      toys:
        - name: scikit-learn
          description: Classification and regression
        - name: PyTorch
          description: Deep learning framework
    - tech: Publishing
      specs: Data code notebooks
      toys:
        - name: GitHub
          description: Version control and hosting
        - name: Jupyter
          description: Interactive notebooks
        - name: Docker
          description: Container platform
        - name: Zenodo
          description: DOI-issuing data archive


