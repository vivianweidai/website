# THE WALL — project cards only.
#
# Every picture on the wall lives in thewall/<science>/ and needs no row here:
#
#   thewall/astronomy/20260730 M 31.jpg
#            ^ the science      ^ sorts    ^ the caption
#
# The folder is the science, the YYYYMMDD prefix is the sort key (never shown),
# and the rest of the filename is the caption. Drop a file in and run
# `python3 pipeline/scripts/build_thewall.py`.
#
# This file holds the one exception: a PROJECT CARD, which links to a write-up
# instead of opening the picture. A project gets exactly one tile — the card —
# and every other photo from it lives on the project page, not on the wall.
# The card's hero is the only thing that still points inside a project folder,
# because the card IS the way into that folder.
#
#   - folder:   the project folder
#     hero:     which of its images fronts the card
#     science:  required, exactly one
#     (the caption is read from that project's index.md title)
#
# Photo tiles pointing into project folders were removed 2026-07-30: a project
# scattering six near-identical photos across the wall was redundancy, and the
# rule "wall photos live on the wall" is easier to hold than a rule with
# exceptions. A chart that belongs on the wall gets copied into
# thewall/<science>/ under its own name.


# The three astronomy projects share a hero format: 720 x 720, so their tiles
# match on the wall, and each one shows the thing that distinguishes its
# measurement — a moving object, a star changing brightness, a rainbow.
- folder: 20260803 Photometry
  hero: photos/figures/xzcyg_blink.gif
  science: Astronomy
- folder: 20260729 Astrometry
  hero: photos/figures/juno_blink.gif
  science: Astronomy
- folder: 20260729 Spectroscopy
  hero: photos/figures/hero.jpg
  science: Astronomy
- folder: 20260420 UV-Vis Spectroscopy
  hero: photos/samples/samples6.jpeg
  science: Chemistry
- folder: 20260419 IR Spectroscopy
  hero: photos/setup/setup2.jpeg
  science: Chemistry
- folder: 20260411 Centrifuge
  hero: photos/samples/samples1.jpeg
  science: Chemistry
- folder: 20260405 Melting Point
  hero: photos/setup/setup3.jpeg
  science: Chemistry
- folder: 20260404 Four Point Probe
  hero: photos/setup/setup13.jpeg
  science: Physics
- folder: 20260401 Genes in Space
  hero: photos/photo.jpeg
  science: Biology
- folder: 20250225 Catfood
  hero: photos/setup/setup1.jpeg
  science: Computing
