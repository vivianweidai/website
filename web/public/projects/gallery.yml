# THE WALL — the rows that still need a manifest.
#
# Most pictures do not appear here at all. Anything under
# gallery/<science>/ is picked up automatically:
#
#   gallery/astronomy/20260730 M 31.jpg
#            ^ the science      ^ sorts the wall   ^ the caption
#
# The folder is the science, the YYYYMMDD prefix is the sort key (never shown),
# and the rest of the filename is the caption. Drop a file in and run
# `python3 pipeline/scripts/build_gallery.py`. Nothing to write here.
#
# Two things still need a row:
#
#   a project card — links to a write-up instead of opening the picture.
#     - folder:   the project folder
#       hero:     which of its images fronts the card
#       science:  required, exactly one
#       (the caption is read from that project's index.md title)
#
#   a picture that lives inside a project folder and should also be on the
#   wall. Referenced in place — never copied into gallery/, or the same bytes
#   land in git twice, which the build rejects by content hash.
#     - src:      path under web/public/projects/
#       science:  required, exactly one
#       caption:  optional; defaults to the filename
#
# One science per picture. Not two, not none.


# ── pictures inside project folders ─────────────────────────────────

