# THE WALL — every picture on /projects/, in one list.
#
# Run `python3 pipeline/scripts/build_gallery.py` after editing. The script
# validates every path and tag and fails loudly, so a mistake here is a build
# error rather than a hole in the grid.
#
# ── a photo tile ────────────────────────────────────────────────────
#   - src:      path under web/public/projects/ — i.e. what follows
#               /projects/ in the URL. Required.
#     caption:  the subject, a few words. Required in practice.
#     note:     optional second line — exposure, condition, what went wrong.
#     science:  one of the six. Required.
#     toy:      optional. Must be a toy that science owns (see technology.yml).
#     date:     optional YYYY-MM. Omit it and the month is read from the
#               photo's own EXIF; only supply it when the file has none
#               (Seestar exports, generated plots, screenshots).
#
# ── a project card ──────────────────────────────────────────────────
#   - folder:   project folder name. hero: picks the image that fronts it.
#     The caption is read from that project's index.md title — never retyped.
#
# ── where the pixels live ───────────────────────────────────────────
#   <YYYYMMDD Project Name>/…   pictures that belong to a project. Point at
#                               them in place; never copy into gallery/.
#   gallery/<YYYY-MM>/…         pictures that belong to no project. One folder
#                               per month, created when that month needs one.
#
# ════════════════════════════════════════════════════════════════════
