# Tech & Toys catalog — single source of truth.
#   Tech = a research capability (a row on the Research page).
#   Toy  = a specific physical instrument that enables a Tech.
# Run `python pipeline/scripts/build_technology.py` after edits to regenerate JSON.
#
# Flat schema — one entry per science, each a plain list of techs:
#   science:    Biology | Chemistry | Physics | Computing |          (required)
#               Mathematics | Astronomy
#   techs:      list of techs (a row on the Research page)           (required)
#     - tech:       string — tech name                               (required)
#       specs:      string — key specs                               (required)
#
# Tech ↔ project links are populated via reverse-scan: declare the tech in
# the project's `index.md` frontmatter `tech:` array and it shows up on
# the tech page automatically.

# ═══════════════════════════════════════════════════════════════
# MATHEMATICS
# ═══════════════════════════════════════════════════════════════

- science: Mathematics
  techs:
    - tech: Numeric
      specs: Approximate
    - tech: Symbolic
      specs: Exact
    - tech: Graphic
      specs: 2D and 3D

# ═══════════════════════════════════════════════════════════════
# COMPUTING
# ═══════════════════════════════════════════════════════════════

- science: Computing
  techs:
    - tech: Statistics
      specs: Inference
    - tech: Machine Learning
      specs: Classic models
    - tech: Publishing
      specs: Data code notebooks

# ═══════════════════════════════════════════════════════════════
# PHYSICS
# ═══════════════════════════════════════════════════════════════

- science: Physics
  techs:
    - tech: Mechanics
      specs: Force, motion and timing
    - tech: Thermodynamics
      specs: Pressure and turbidity
    - tech: Electromagnetism
      specs: Magnetism and spectra
    - tech: Engineering
      specs: Circuits and fabrication

# ═══════════════════════════════════════════════════════════════
# CHEMISTRY
# ═══════════════════════════════════════════════════════════════

- science: Chemistry
  techs:
    - tech: Thermal
      specs: Heat and mass
    - tech: Electrochemistry
      specs: Ions and redox
    - tech: Spectroscopy
      specs: Bonds, absorbance, chirality
    - tech: Spectrometry
      specs: Separation and mass

# ═══════════════════════════════════════════════════════════════
# BIOLOGY
# ═══════════════════════════════════════════════════════════════

- science: Biology
  techs:
    - tech: Microscopes
      specs: Surfaces to cells
    - tech: Physiology
      specs: Live body signals
    - tech: Genomics
      specs: Amplify, read, express

# ═══════════════════════════════════════════════════════════════
# ASTRONOMY
# ═══════════════════════════════════════════════════════════════

- science: Astronomy
  techs:
    - tech: Telescopes
      specs: Light collectors
    - tech: Measurements
      specs: Position, brightness, spectra
    - tech: Classification
      specs: Events and morphology
