# Tech & Toys catalog — single source of truth.
#   Tech = a research capability (a row on the Research page).
#   Toy  = a specific physical instrument that enables a Tech.
# Run `python pipeline/scripts/build_technology.py` after edits to regenerate JSON.
#
# Flat schema — one entry per science, each a plain list of techs:
#   science:    Biology | Chemistry | Physics | Computing |          (required)
#               Mathematics | Astronomy
#   techs:      list of techs (a row on the Research page)           (required)
#     - tech:       string — tech name                               (required)
#       specs:      string — key specs                               (required)
#       available:  true                                             (optional — set when a Toy enables it)
#       url:        string — external URL (links the tech name)      (optional)
#       tested:     false                                            (optional — override; default = has a project)
#
# Tech ↔ project links are populated via reverse-scan: declare the tech in
# the project's `index.md` frontmatter `tech:` array and it shows up on
# the tech page automatically.
#
# Tested vs Accessed marker on /research/:
#   ✓ Tested  = at least one project links to the tech (default)
#   – Accessed = available but no projects yet
#   Override with `tested: true|false` to force the marker regardless of links.

# ═══════════════════════════════════════════════════════════════
# MATHEMATICS
# ═══════════════════════════════════════════════════════════════

- science: Mathematics
  techs:
    - tech: Numeric
      specs: Approximate
      available: true
      url: /research/projects/20260420%20UV-Vis%20Spectroscopy/
    - tech: Symbolic
      specs: Exact
      available: true
      url: https://www.wolframcloud.com/obj/jamesdai/Published/exoplanets.nb
    - tech: Graphic
      specs: 2D and 3D
      available: true
      url: /research/projects/20260404%20Four%20Point%20Probe/

